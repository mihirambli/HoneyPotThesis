# Baseline config for the `apache` service — the SAME edge with WADM removed.
#
# Mounted in place of httpd.conf via ${HTTPD_CONF} (see docker-compose.yml) by
# benchmarks/run_baseline_benchmark.py. Server identity, logging, MPM and the reverse proxy are
# kept byte-identical to httpd.conf so the bare-vs-WADM delta is attributable to the filter chain.
#
# Removed relative to httpd.conf: mod_lua, mod_filter and mod_headers, plus every directive that
# depends on them — LuaPackagePath, LuaScope, LuaOutputFilter, LuaHookAccessChecker,
# LuaCodeCache, LuaMapHandler, SetOutputFilter, and `Header always unset Content-Length`.
#
# That last removal is a real, intended protocol difference between the tiers: with WADM active
# Apache must drop Content-Length so the injected body may change size (responses go chunked),
# whereas here responses keep their upstream Content-Length. The cost of that belongs in the
# measured WADM overhead, so it must NOT be reproduced here.

ServerRoot "/usr/local/apache2"
Listen 80

User  daemon
Group daemon

ServerName localhost

ErrorLog  /proc/self/fd/2
# No access log: Envoy writes none, so this charged Apache a per-request write the Envoy edges never
# pay. The per-request record now lives in the origin's access log (client IP via
# X-Forwarded-For, which mod_proxy adds) plus the WADM ALERT / WADM TRAP lines.

# ── Core modules required for a functional httpd process ─────────────────────
LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule dir_module          modules/mod_dir.so
LoadModule mime_module         modules/mod_mime.so

# ── Reverse proxy ─────────────────────────────────────────────────────────────
LoadModule proxy_module        modules/mod_proxy.so
LoadModule proxy_http_module   modules/mod_proxy_http.so

<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyPass        / http://backend:80/
    ProxyPassReverse / http://backend:80/
</VirtualHost>
