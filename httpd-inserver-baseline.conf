# Baseline config for the `apache-inserver` service — the SAME in-server Apache with WADM removed:
# Apache serving backend/www itself, as it did before WADM existed.
#
# Mounted in place of httpd-inserver.conf via ${HTTPD_INSERVER_CONF} (see docker-compose.yml) by
# benchmarks/run_paired_benchmark.py. Server identity, logging, MPM, mime handling, the document
# root and every mapping (AliasMatch, the gz <Location>, RedirectMatch) are kept byte-identical to
# httpd-inserver.conf, so both tiers serve the same responses and the bare-vs-WADM delta is
# attributable to the filter chain. mod_filter stays because AddOutputFilterByType needs it here.
#
# Removed relative to httpd-inserver.conf: mod_lua and mod_headers, plus every directive that
# depends on them — LuaPackagePath, LuaScope, LuaCodeCache, LuaOutputFilter, LuaHookAccessChecker,
# LuaMapHandler, SetOutputFilter, and `Header always unset Content-Length`.
#
# That last removal is a real, intended protocol difference between the tiers: with WADM active
# Apache must drop Content-Length so the injected body may change size (responses go chunked),
# whereas here static files keep their Content-Length. The cost of that belongs in the measured
# WADM overhead, so it must NOT be reproduced here.

ServerRoot "/usr/local/apache2"
Listen 80

User  daemon
Group daemon

ServerName localhost

ErrorLog  /proc/self/fd/2
# No access log, as in httpd.conf, so both deployments do the same per-request work. In this
# deployment no origin logs the request either: the per-request record is the WADM ALERT /
# WADM TRAP lines.

# ── Core modules required for a functional httpd process ─────────────────────
LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule dir_module          modules/mod_dir.so
LoadModule mime_module         modules/mod_mime.so

# ── mod_filter: required for AddOutputFilterByType ────────────────────────────
LoadModule filter_module       modules/mod_filter.so

# ── File serving: the mappings below, and gzip for the functional-matrix case ──
LoadModule alias_module        modules/mod_alias.so
LoadModule deflate_module      modules/mod_deflate.so

# Without it mod_mime has no extension map, and every page would go out without
# Content-Type: text/html, which inject.lua requires before it injects anything.
TypesConfig conf/mime.types

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot "/srv/www"
    <Directory "/srv/www">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # "/" mapped directly, as the OpenResty in-server variant must map it: nginx's `index` re-runs
    # the access phase on its internal redirect and detects a trigger twice. Resolving "/" through
    # mod_dir was measured NOT to re-run detect.lua here (one alert, one header-staging line), so in
    # Apache this keeps the two variants' request paths alike rather than fixing a double count.
    AliasMatch "^/$" "/srv/www/index.html"

    # Mirrors backend/nginx.conf so the functional matrix exercises the same cases.
    <Location "/test/gz/">
        AddOutputFilterByType DEFLATE text/html
    </Location>
    RedirectMatch 204 "^/test/empty$"
</VirtualHost>
