# httpd-inserver.conf — Apache in-server variant (profile: apache-inserver). Apache serves
# backend/www itself and runs the same mod_lua WADM scripts as the proxy variant (httpd.conf) on its
# own responses, with no proxy hop and no origin server in the request path.
# Phase 1: LuaHookAccessChecker (detect.lua) inspects and cleans query strings before the file is served.
# Phase 2: SetOutputFilter (inject.lua) injects HTML honeytoken comments into responses.
#
# Derived from httpd.conf. Removed: mod_proxy, mod_proxy_http and the ProxyPass* directives. Added:
# mod_alias, mod_deflate, TypesConfig and a DocumentRoot with the mappings below, which reproduce
# what backend/nginx.conf serves. The scripts in apache_scripts/ are shared with the proxy variant,
# not copied, so both run the same module code.

ServerRoot "/usr/local/apache2"
Listen 80

User  daemon
Group daemon

ServerName localhost

ErrorLog  /proc/self/fd/2
# No access log, as in httpd.conf, so both deployments do the same per-request work. In this
# deployment no origin logs the request either: the per-request record is the WADM ALERT /
# WADM TRAP lines.

# ── Core modules required for a functional httpd process ─────────────────────
LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule dir_module          modules/mod_dir.so
LoadModule mime_module         modules/mod_mime.so

# ── mod_headers: strip Content-Length on filtered responses so body size change is safe ─
LoadModule headers_module      modules/mod_headers.so

# ── mod_lua: WADM hooks ────────────────────────────────────────────────────────
LoadModule lua_module          modules/mod_lua.so

# ── mod_filter: required for AddOutputFilterByType ────────────────────────────
LoadModule filter_module       modules/mod_filter.so

# ── File serving: the mappings below, and gzip for the functional-matrix case ──
LoadModule alias_module        modules/mod_alias.so
LoadModule deflate_module      modules/mod_deflate.so

# Without it mod_mime has no extension map, and every page would go out without
# Content-Type: text/html, which inject.lua requires before it injects anything.
TypesConfig conf/mime.types

# ── Lua runtime ────────────────────────────────────────────────────────────────
LuaPackagePath "/usr/local/apache2/scripts/?.lua"
# thread scope: module-level variables (config, keyword) are loaded once per worker thread.
LuaScope thread
# Load each script once, like the other three edges do. The default (`stat`) stats every script
# file on every hook call to check for edits; after an edit, `docker compose restart apache-inserver`.
LuaCodeCache forever

# Register the output filter name at server scope (required by SetOutputFilter below).
LuaOutputFilter WADM_INJECT /usr/local/apache2/scripts/inject.lua handle_inject

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot "/srv/www"
    <Directory "/srv/www">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Phase 1 — Detection & cleaning (request), plus staging the response-header baits.
    LuaHookAccessChecker /usr/local/apache2/scripts/detect.lua handle_detect early

    # Phase 1a — Fake SQL-injection trap. handle_login returns DECLINED for anything it does not
    # own, so the core serves the file (or answers 404) as it would without WADM.
    # The pattern is anchored because mod_lua matches it as an unanchored regex search.
    LuaMapHandler "^/api/login$" /usr/local/apache2/scripts/login.lua handle_login

    # "/" mapped directly, as the OpenResty in-server variant must map it: nginx's `index` re-runs
    # the access phase on its internal redirect and detects a trigger twice. Resolving "/" through
    # mod_dir was measured NOT to re-run detect.lua here (one alert, one header-staging line), so in
    # Apache this keeps the two variants' request paths alike rather than fixing a double count.
    AliasMatch "^/$" "/srv/www/index.html"

    # Mirrors backend/nginx.conf so the functional matrix exercises the same cases.
    <Location "/test/gz/">
        AddOutputFilterByType DEFLATE text/html
    </Location>
    RedirectMatch 204 "^/test/empty$"

    # Phase 2 — Injection (response).
    # SetOutputFilter applies the filter unconditionally; inject.lua guards on content-type internally.
    # Header always unset removes Content-Length so the body size change from injection is safe.
    SetOutputFilter WADM_INJECT
    Header always unset Content-Length
</VirtualHost>
