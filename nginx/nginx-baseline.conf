# Baseline config for the `openresty` service — the SAME edge with WADM removed.
#
# Mounted in place of nginx.conf via ${OPENRESTY_CONF} (see docker-compose.yml) by
# benchmarks/run_baseline_benchmark.py. Everything outside the WADM layer is kept byte-identical
# to nginx.conf — worker/event tuning, mime handling, sendfile, the upstream and its keep-alive
# pool, the listener, and the proxy_* directives — so a bare-vs-WADM delta is attributable to the
# filter chain
# and nothing else. Removed relative to nginx.conf: lua_shared_dict wadm_state, init_by_lua_block,
# access_by_lua_block, header_filter_by_lua_block, body_filter_by_lua_block.

worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    # nginx logs every request by default; Envoy writes no access log, so leaving this on charged
    # OpenResty a per-request write the Envoy edges never pay. The per-request record now lives in
    # the origin's access log (client IP via X-Forwarded-For) plus the WADM ALERT / WADM TRAP lines.
    access_log off;

    upstream backend {
        server backend:80;
        # Reuse upstream connections rather than opening a new TCP connection per request.
        # Envoy and Apache pool backend connections by default and nginx does not, so without
        # this OpenResty is measured doing strictly more work than the edges it is compared
        # against. The cache is per worker process: the real ceiling is 32 x worker_processes.
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend;
            # Both are required before the upstream `keepalive` pool above is used at all: nginx
            # proxies with HTTP/1.0 by default, which has no persistent connections, and would
            # otherwise forward the client's Connection header upstream and close the pooled
            # connection.
            proxy_http_version 1.1;
            proxy_set_header Connection      "";
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
