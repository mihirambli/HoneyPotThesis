# Baseline config for the `openresty-inserver` service — the SAME in-server OpenResty with WADM
# removed: OpenResty serving backend/www itself, as it did before WADM existed.
#
# Mounted in place of nginx-inserver.conf via ${OPENRESTY_INSERVER_CONF} (see docker-compose.yml)
# by benchmarks/run_paired_benchmark.py. Everything outside the WADM layer is kept byte-identical
# to nginx-inserver.conf — worker/event tuning, mime handling, sendfile, the listener, the document
# root and every location block — so a bare-vs-WADM delta is attributable to the filter chain and
# nothing else. Removed relative to nginx-inserver.conf: lua_shared_dict wadm_state,
# init_by_lua_block, access_by_lua_block, header_filter_by_lua_block, body_filter_by_lua_block.

worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    # Off as in nginx.conf, so both deployments do the same per-request work. In this deployment
    # no origin logs the request either: the per-request record is the WADM ALERT / WADM TRAP lines.
    access_log off;

    server {
        listen 80;
        server_name _;
        root /srv/www;

        # "/" must not go through `index`: its internal redirect re-runs the access phase (and
        # clears ngx.ctx), so detection would run twice per request. try_files serves the file in
        # place.
        location = / { try_files /index.html =404; }
        location / { }

        # Mirrors backend/nginx.conf so the functional matrix exercises the same cases.
        location /test/gz/ { gzip on; gzip_types text/html; gzip_min_length 0; }
        # try_files runs after the access phase, so detection and header baits apply exactly as
        # when the proxy forwarded this request; `return 204` would skip the access phase.
        location = /test/empty { try_files /__no_such_file__ =204; }
    }
}
