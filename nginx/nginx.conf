worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    # nginx logs every request by default; Envoy writes no access log, so leaving this on charged
    # OpenResty a per-request write the Envoy edges never pay. The per-request record now lives in
    # the origin's access log (client IP via X-Forwarded-For) plus the WADM ALERT / WADM TRAP lines.
    access_log off;

    # In-memory store for "we saw a trigger from this IP" (TTL 86400s in Lua), shared by all workers.
    lua_shared_dict wadm_state 10m;

    # Runs once in the master before fork, so every worker inherits the parsed config and the
    # precompiled plans below. Everything is a local of this chunk and published through the one
    # global `wadm` table, because the per-phase blocks run as separate chunks.
    init_by_lua_block {
        local cjson = require "cjson"
        local ffi = require "ffi"

        local find, sub, gsub, gmatch, match = string.find, string.sub, string.gsub, string.gmatch, string.match
        local lower, char, tonumber = string.lower, string.char, tonumber
        local concat = table.concat

        ffi.cdef[[
            typedef long time_t;
            typedef long suseconds_t;
            struct timeval {
                time_t tv_sec;
                suseconds_t tv_usec;
            };
            int gettimeofday(struct timeval *tv, void *tz);
        ]]

        -- One timeval per worker (each inherits its own copy at fork) instead of an ffi.new
        -- allocation on every timer read; the Lua VM is single-threaded per worker, so reuse is safe.
        local tv = ffi.new("struct timeval")
        local function now_us()
            if ffi.C.gettimeofday(tv, nil) ~= 0 then
                ngx.log(ngx.ERR, "WADM: gettimeofday failed; falling back to ngx.now()")
                return math.floor(ngx.now() * 1000000)
            end
            return tonumber(tv.tv_sec) * 1000000 + tonumber(tv.tv_usec)
        end

        local file, err = io.open("/etc/openresty/config.json", "r")
        if not file then
            ngx.log(ngx.ERR, "WADM: failed to open config file: ", err)
            return
        end
        local content = file:read("*a")
        file:close()

        local ok, config = pcall(cjson.decode, content)
        if not ok then
            ngx.log(ngx.ERR, "WADM: failed to parse config JSON: ", config)
            return
        end

        local ht = config.honeytokens or {}
        local post_body_inspection = config.post_body_inspection == true
        local state = ngx.shared.wadm_state

        -- Per-token on/off switch. A disabled token is fully dormant — neither injected nor
        -- watched. Absent defaults to ON so tokens authored before this field keep working.
        local function token_enabled(token)
            local v = token.enabled
            if v == nil then return true end
            if v == true or v == 1 then return true end
            if type(v) == "string" then
                local s = lower(v)
                return s == "1" or s == "on" or s == "true" or s == "yes"
            end
            return false
        end

        local function enabled_tokens(list)
            local out = {}
            for _, t in ipairs(list or {}) do
                if token_enabled(t) then out[#out + 1] = t end
            end
            return out
        end

        local function nonempty(s)
            if s == nil or s == "" then return nil end
            return s
        end

        -- ── Precompiled per-path plans ────────────────────────────────────────────────
        -- Paths are only ever "/*" or exact, so every request resolves to one of a handful of
        -- plans. Building them here replaces the per-request token loops, enabled checks and
        -- markup concatenation, which was CPU spent on every response. Config order is kept
        -- within each list because it decides the joined comment order and the splice order.

        local comment_tokens = enabled_tokens(ht.html_comments)
        local header_tokens = enabled_tokens(ht.http_headers)
        local cookie_tokens = enabled_tokens(ht.cookies)
        local decoy_tokens = enabled_tokens(ht.decoy_paths)
        local form_tokens = enabled_tokens(ht.form_fields)

        local function covers(paths, path)
            for _, p in ipairs(paths or {}) do
                if p == "/*" or p == path then return true end
            end
            return false
        end

        local function build_plan(path)
            local comments = {}
            for _, t in ipairs(comment_tokens) do
                if t.comment_value and covers(t.paths, path) then
                    comments[#comments + 1] = t.comment_value
                end
            end
            local headers = {}
            for _, t in ipairs(header_tokens) do
                if nonempty(t.header_name) and covers(t.paths, path) then
                    headers[#headers + 1] = { name = t.header_name, value = t.header_value or "" }
                end
            end
            local cookies = {}
            for _, t in ipairs(cookie_tokens) do
                if nonempty(t.cookie_name) and covers(t.paths, path) then
                    local c = t.cookie_name .. "=" .. (t.cookie_value or "")
                    if nonempty(t.attributes) then c = c .. "; " .. t.attributes end
                    cookies[#cookies + 1] = c
                end
            end
            local extras = {}
            for _, t in ipairs(decoy_tokens) do
                if (t.advertise_via or "link") == "link" and covers(t.advertise_on_paths, path) then
                    extras[#extras + 1] = {
                        kind = "decoy_paths", anchor = "</body>",
                        markup = '<a href="' .. (t.trap_path or "") .. '" style="display:none">'
                            .. (t.link_text or "") .. '</a>',
                    }
                end
            end
            for _, t in ipairs(form_tokens) do
                if nonempty(t.field_name) and covers(t.paths, path) then
                    extras[#extras + 1] = {
                        kind = "form_fields", anchor = "</form>",
                        markup = '<input type="hidden" name="' .. t.field_name .. '" value="'
                            .. (t.field_value or "") .. '">',
                    }
                end
            end
            local joined = #comments > 0 and concat(comments, "\n") or nil
            return {
                comments = joined, headers = headers, cookies = cookies, extras = extras,
                has_body = joined ~= nil or #extras > 0,
            }
        end

        local plans = {}
        local function note_paths(paths)
            for _, p in ipairs(paths or {}) do
                if p ~= "/*" then plans[p] = true end
            end
        end
        for _, list in ipairs({ comment_tokens, header_tokens, cookie_tokens, form_tokens }) do
            for _, t in ipairs(list) do note_paths(t.paths) end
        end
        for _, t in ipairs(decoy_tokens) do note_paths(t.advertise_on_paths) end
        for p in pairs(plans) do plans[p] = build_plan(p) end
        local plan_default = build_plan(nil)

        local triggers = {}
        for _, t in ipairs(comment_tokens) do
            if nonempty(t.trigger_keyword) then triggers[#triggers + 1] = t.trigger_keyword end
        end

        -- ── Shared request parsing ─────────────────────────────────────────────────────

        local function url_decode(s)
            s = gsub(s, "%+", " ")
            return (gsub(s, "%%(%x%x)", function(h) return char(tonumber(h, 16)) end))
        end

        -- Ordered segments that keep their raw text: the strip rebuilds the query from the raw
        -- text of the segments it keeps, so order and original encoding survive, identically on
        -- all four edges. Decoding is skipped for the common segment that has nothing to decode.
        local function parse_query(q)
            local segs = {}
            if not q or q == "" then return segs end
            local pos, n = 1, #q
            while pos <= n do
                local amp = find(q, "&", pos, true)
                local last = amp and amp - 1 or n
                if last >= pos then
                    local raw = sub(q, pos, last)
                    local eq = find(raw, "=", 1, true)
                    local k = eq and sub(raw, 1, eq - 1) or raw
                    local v = eq and sub(raw, eq + 1) or ""
                    if find(raw, "%", 1, true) or find(raw, "+", 1, true) then
                        k, v = url_decode(k), url_decode(v)
                    end
                    segs[#segs + 1] = { raw = raw, key = k, value = v }
                end
                if not amp then break end
                pos = amp + 1
            end
            return segs
        end

        local function join_kept(segs, dropped)
            local kept = {}
            for i = 1, #segs do
                if not dropped[i] then kept[#kept + 1] = segs[i].raw end
            end
            return concat(kept, "&")
        end

        local function cookie_value(header, name)
            if not header then return nil end
            for pair in gmatch(header, "[^;]+") do
                local k, v = match(pair, "^%s*(.-)%s*=%s*(.-)%s*$")
                if k == name then return v end
            end
            return nil
        end

        -- Substring scan of a request's target surface (path, Host, query) for a keyword an
        -- attacker would replay after harvesting a planted header or cookie value.
        local function keyword_in_request(kw, ctx)
            if find(ctx.path, kw, 1, true) or (ctx.host and find(ctx.host, kw, 1, true)) then
                return true
            end
            local segs = ctx.segs
            for i = 1, #segs do
                local s = segs[i]
                if find(s.key, kw, 1, true) or find(s.value, kw, 1, true) then return true end
            end
            return false
        end

        -- Fixed-anchor first-match splice: a plain find (patterns disabled) and two subs, the
        -- same primitive on every edge. ngx.re.sub was used here before; it was case-insensitive
        -- PCRE, so OpenResty was the one edge whose splice differed in both behaviour and cost.
        local function splice_before(body, anchor, insert)
            local pos = find(body, anchor, 1, true)
            if not pos then return nil end
            return sub(body, 1, pos - 1) .. insert .. "\n" .. sub(body, pos)
        end

        -- CR/LF would let an attacker forge whole log lines that the benchmark scrapers read.
        local function log_safe(s)
            return (gsub(s, "[\r\n]", " "))
        end

        -- ── Additional honeytoken kinds: compiled detectors ────────────────────────────
        -- Detectors record hits as small descriptors and this renders them afterwards, so that
        -- alert *formatting and writing* both sit outside the detection timer. Log I/O otherwise
        -- dominated the measurement (see docs/EDGE_LEVELING.md). The wire format is identical on
        -- all edges.
        local function format_alert(ip, hit)
            local prefix = "WADM ALERT: honeytoken triggered by " .. ip .. " — "
            local t = hit.tpl
            if t == "header_replay" then
                return prefix .. "http_header value '" .. hit.a .. "' replayed in request"
            elseif t == "cookie_tamper" then
                return prefix .. "cookie '" .. hit.a .. "' tampered (got '" .. log_safe(hit.b)
                    .. "', expected '" .. hit.c .. "')"
            elseif t == "cookie_replay" then
                return prefix .. "cookie value '" .. hit.a .. "' replayed in request"
            elseif t == "decoy_hit" then
                return prefix .. "decoy path '" .. hit.a .. "' requested (" .. log_safe(hit.b) .. ")"
            elseif t == "form_tamper" then
                return prefix .. "form field '" .. hit.a .. "' tampered (got '" .. log_safe(hit.b)
                    .. "', expected '" .. hit.c .. "')"
            elseif t == "form_tamper_post" then
                return prefix .. "form field '" .. hit.a .. "' tampered in POST (got '"
                    .. log_safe(hit.b) .. "', expected '" .. hit.c .. "')"
            elseif t == "query_keyword" then
                return prefix .. "keyword '" .. hit.a .. "' found in " .. hit.where .. " '"
                    .. log_safe(hit.b) .. "=" .. log_safe(hit.c) .. "'"
            elseif t == "body_keyword" then
                return prefix .. "keyword '" .. hit.a .. "' found in request body"
            else
                return prefix .. "form field keyword '" .. hit.a .. "' seen in request"
            end
        end

        local header_detect = {}
        for _, t in ipairs(header_tokens) do
            if nonempty(t.trigger_keyword) then header_detect[#header_detect + 1] = t.trigger_keyword end
        end
        local cookie_detect = {}
        for _, t in ipairs(cookie_tokens) do
            local name, kw = nonempty(t.cookie_name), nonempty(t.trigger_keyword)
            if name or kw then
                cookie_detect[#cookie_detect + 1] = { name = name, value = t.cookie_value or "", kw = kw }
            end
        end
        local decoy_detect = {}
        for _, t in ipairs(decoy_tokens) do
            if nonempty(t.trap_path) then
                decoy_detect[#decoy_detect + 1] = {
                    trap = t.trap_path, prefix = t.trap_path .. "/",
                    exact = (t.match_type or "prefix") == "exact",
                }
            end
        end
        local form_detect = {}
        for _, t in ipairs(form_tokens) do
            local name, kw = nonempty(t.field_name), nonempty(t.trigger_keyword)
            if name or kw then
                form_detect[#form_detect + 1] = { name = name, value = t.field_value or "", kw = kw }
            end
        end

        -- The first mismatching submission is the tamper evidence; later duplicates add nothing.
        local function first_tamper(segs, name, expected)
            if not segs then return nil end
            for i = 1, #segs do
                local s = segs[i]
                if s.key == name and s.value ~= expected then return s.value end
            end
            return nil
        end

        local detectors = {
            http_headers = function(tokens, ctx, hits)
                for i = 1, #tokens do
                    if keyword_in_request(tokens[i], ctx) then
                        hits[#hits + 1] = { tpl = "header_replay", a = tokens[i] }
                    end
                end
            end,

            -- A real browser replays the planted value unchanged, so a value that returns
            -- DIFFERENT is an attacker tampering with it (near-zero false positives).
            cookies = function(tokens, ctx, hits)
                for i = 1, #tokens do
                    local t = tokens[i]
                    if t.name then
                        local v = cookie_value(ctx.cookie, t.name)
                        if v ~= nil and v ~= t.value then
                            hits[#hits + 1] = { tpl = "cookie_tamper", a = t.name, b = v, c = t.value }
                        end
                    end
                    if t.kw and keyword_in_request(t.kw, ctx) then
                        hits[#hits + 1] = { tpl = "cookie_replay", a = t.kw }
                    end
                end
            end,

            decoy_paths = function(tokens, ctx, hits)
                local path = ctx.path
                for i = 1, #tokens do
                    local t = tokens[i]
                    local hit = path == t.trap
                        or (not t.exact and sub(path, 1, #t.prefix) == t.prefix)
                    if hit then
                        hits[#hits + 1] = { tpl = "decoy_hit", a = t.trap, b = path }
                    end
                end
            end,

            -- A submission carrying a DIFFERENT value means the attacker edited the hidden input.
            form_fields = function(tokens, ctx, hits)
                for i = 1, #tokens do
                    local t = tokens[i]
                    if t.name then
                        local got = first_tamper(ctx.segs, t.name, t.value)
                        if got then
                            hits[#hits + 1] = { tpl = "form_tamper", a = t.name, b = got, c = t.value }
                        else
                            got = first_tamper(ctx.body_segs, t.name, t.value)
                            if got then
                                hits[#hits + 1] = { tpl = "form_tamper_post", a = t.name, b = got, c = t.value }
                            end
                        end
                    end
                    if t.kw and keyword_in_request(t.kw, ctx) then
                        hits[#hits + 1] = { tpl = "form_keyword", a = t.kw }
                    end
                end
            end,
        }

        -- Fixed order so the per-kind timing regions run in the same sequence on every edge.
        -- Kinds with nothing to detect are dropped here rather than timed as empty loops.
        local kinds = {}
        for _, k in ipairs({
            { "http_headers", header_detect }, { "cookies", cookie_detect },
            { "decoy_paths", decoy_detect }, { "form_fields", form_detect },
        }) do
            if #k[2] > 0 then
                kinds[#kinds + 1] = { name = k[1], tokens = k[2], detect = detectors[k[1]] }
            end
        end
        local need_cookie = #cookie_detect > 0

        -- ── Fake SQL-injection trap (config key `sql_injection`) ─────────────────────
        -- The login endpoint has no origin route, so the edge terminates it and plays a
        -- vulnerable MySQL app.

        local sqli = config.sql_injection
        if sqli and not token_enabled(sqli) then sqli = nil end
        local sqli_methods, sqli_paths, sqli_any_path = {}, {}, false
        if sqli then
            for _, m in ipairs(sqli.methods or {}) do sqli_methods[m] = true end
            for _, p in ipairs(sqli.paths or {}) do
                if p == "/*" then sqli_any_path = true else sqli_paths[p] = true end
            end
        end

        -- Owned = the request the trap answers itself. Scoped by method AND path so the
        -- benchmarked GET population (including GET /api/login?password=…) is untouched.
        local function sqli_owns(method, path)
            return sqli ~= nil and (sqli_any_path or sqli_paths[path] == true)
                and sqli_methods[method] == true
        end

        -- Signatures are stored pre-lowercased and space-normalised, so the same folding must
        -- be applied to the input. ASCII-only lowercasing keeps the three Lua edges and the
        -- Rust edge byte-identical (Rust's Unicode to_lowercase would diverge here).
        local function sqli_normalize(v)
            return (gsub(lower(url_decode(v)), "%s+", " "))
        end

        -- Loop order (watch_fields → body pairs → signatures) is part of the cross-edge
        -- contract: it makes "first match wins" resolve identically on all four edges. Every
        -- body segment is decoded here (not only the ones containing % or +) because the
        -- signatures must see the normalised text.
        local function sqli_match(raw)
            local pairs_out = {}
            for chunk in gmatch(raw or "", "[^&]+") do
                local k, v = match(chunk, "^(.-)=(.*)$")
                if not k then k, v = chunk, "" end
                pairs_out[#pairs_out + 1] = { key = url_decode(k), value = url_decode(v) }
            end
            for _, field in ipairs(sqli.watch_fields or {}) do
                for _, pair in ipairs(pairs_out) do
                    if pair.key == field then
                        local norm = sqli_normalize(pair.value)
                        for _, sig in ipairs(sqli.signatures or {}) do
                            if find(norm, sig, 1, true) then
                                return { field = field, value = pair.value, signature = sig }
                            end
                        end
                    end
                end
            end
            return nil
        end

        -- The trap reflects attacker-controlled input; without escaping the honeypot would
        -- itself be a live reflected-XSS vector against anyone who views the page.
        local function html_escape(s)
            s = gsub(s, "&", "&amp;")
            s = gsub(s, "<", "&lt;")
            s = gsub(s, ">", "&gt;")
            s = gsub(s, '"', "&quot;")
            s = gsub(s, "'", "&#39;")
            return s
        end

        local function sqli_render(template, payload)
            local escaped = html_escape(sub(payload, 1, sqli.reflect_max_len or 200))
            -- Replacement FUNCTION, not string: a payload such as `100%' OR 1=1--` keeps a bare
            -- `%`, which gsub would reject as an invalid replacement escape and turn into a 500.
            return (gsub(template, "{PAYLOAD}", function() return escaped end))
        end

        -- Placed first in the access phase and terminal: an owned request never reaches any
        -- other detector, which keeps Apache (whose access hook runs before its handler)
        -- observably identical. POST-only, so the k6 GET population is unaffected.
        local function sqli_respond(ip, method, path)
            ngx.req.read_body()
            local raw = ngx.req.get_body_data() or ""

            -- Closed before the hit/miss branch so every arm measures the same unit: the scan
            -- alone, with page rendering and the IP record outside it. The scan covers decoding
            -- each body pair, normalising the watched values and walking the signature list, and
            -- the benchmark drives all four combinations of outcome and encoding to attribute the
            -- cost between them.
            local sqli_start_us = now_us()
            local hit = sqli_match(raw)
            local sqli_delta_us = now_us() - sqli_start_us

            local body, status
            if hit then
                body = sqli_render(sqli.error_template, hit.value)
                status = sqli.status_code or 500
            else
                body = sqli.deny_template
                status = sqli.deny_status_code or 401
            end

            -- The IP record stays outside the timed region, unlike the honeytoken kinds':
            -- only the hit arms perform it, so including it would surface as a hit-vs-miss
            -- difference that has nothing to do with the scan.

            -- Percent-encoded input is an evasion technique worth recording in its own right, and it is
            -- also where the scan actually spends its time: url_decode's substitution path runs over
            -- every body pair and again during normalisation, while most signatures are rejected on
            -- length before a character is compared. Recording the four arms separately is what lets
            -- detection cost be attributed to normalisation rather than to scan depth. Classified after
            -- the timer closes so it never enters the measurement.
            local kind = hit and "sql_injection" or "sql_injection_miss"
            if find(raw, "%", 1, true) then kind = kind .. "_encoded" end

            if hit then
                ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ip,
                    " — sql_injection signature '", hit.signature, "' in field '",
                    hit.field, "' on ", method, " ", path,
                    " (payload '", log_safe(hit.value), "')")
                state:set(ip, true, 86400)
            else
                -- These requests never reach the origin, so without an edge access log this is
                -- the only record that the trap endpoint was hit.
                ngx.log(ngx.WARN, "WADM TRAP: ", ip, " ", method, " ", path,
                    " answered locally with ", status, " (no signature matched)")
            end
            ngx.log(ngx.WARN, "WADM TOKEN ", kind, " detect (us): ", sqli_delta_us)

            ngx.status = status
            ngx.header["Content-Type"] = "text/html; charset=UTF-8"
            ngx.header["Content-Length"] = #body
            ngx.print(body)
            -- HTTP_OK, not `status`: ngx.exit with a 4xx/5xx discards the body and renders
            -- nginx's own error page instead.
            return ngx.exit(ngx.HTTP_OK)
        end

        -- ── Phase handlers ─────────────────────────────────────────────────────────────

        local function detect_kinds(ctx)
            local ip = ctx.ip
            for i = 1, #kinds do
                local k = kinds[i]
                -- Timed region = the kind's scan + the in-memory IP record. Setup (ctx) is
                -- built before and alert rendering/logging happens after, as on every edge.
                local hits = {}
                local kind_start_us = now_us()
                k.detect(k.tokens, ctx, hits)
                if #hits > 0 then
                    state:set(ip, true, 86400)
                end
                local kind_delta_us = now_us() - kind_start_us

                if #hits > 0 then
                    for j = 1, #hits do
                        ngx.log(ngx.WARN, format_alert(ip, hits[j]))
                    end
                    -- Timed only on a hit, so every edge samples the same population.
                    ngx.log(ngx.WARN, "WADM TOKEN ", k.name, " detect (us): ", kind_delta_us)
                end
            end
        end

        local function scan_segments(segs, where, hits)
            local dropped
            for i = 1, #segs do
                local s = segs[i]
                for j = 1, #triggers do
                    local kw = triggers[j]
                    if find(s.key, kw, 1, true) or find(s.value, kw, 1, true) then
                        hits[#hits + 1] = { tpl = "query_keyword", a = kw, b = s.key, c = s.value, where = where }
                        dropped = dropped or {}
                        dropped[i] = true
                    end
                end
            end
            return dropped
        end

        -- html_comments detection (the benchmarked reference). Query parsing happens in setup,
        -- so the timed region is scan → strip → write back → record, the same on all edges.
        local function detect_comments(ctx)
            if #triggers == 0 then return end
            local ip = ctx.ip
            local hits = {}
            local detection_start_us = now_us()

            local dropped = scan_segments(ctx.segs, "query param", hits)
            if dropped then
                ngx.req.set_uri_args(join_kept(ctx.segs, dropped))
            end

            -- POST-body inspection (behind post_body_inspection; off by default so detection is
            -- a query-string scan only on every edge). OpenResty and Envoy+Lua implement it.
            if ctx.body_segs then
                local body_dropped = scan_segments(ctx.body_segs, "POST param", hits)
                if body_dropped then
                    ngx.req.set_body_data(join_kept(ctx.body_segs, body_dropped))
                end
            elseif ctx.raw_body then
                for j = 1, #triggers do
                    if find(ctx.raw_body, triggers[j], 1, true) then
                        hits[#hits + 1] = { tpl = "body_keyword", a = triggers[j] }
                    end
                end
            end

            if #hits > 0 then
                state:set(ip, true, 86400)
            end
            local detection_delta_us = now_us() - detection_start_us

            if #hits > 0 then
                for j = 1, #hits do
                    ngx.log(ngx.WARN, format_alert(ip, hits[j]))
                end
                -- Only trigger-bearing requests are timed so all edges sample the same population.
                ngx.log(ngx.WARN, "Detection execution time (us): ", detection_delta_us)
            end
        end

        local M = {}

        function M.access()
            local var = ngx.var
            local ip = var.remote_addr
            local target = var.request_uri
            local qpos = find(target, "?", 1, true)
            local path = qpos and sub(target, 1, qpos - 1) or target
            local c = { plan = plans[path] or plan_default }
            ngx.ctx.wadm = c

            if sqli then
                local method = ngx.req.get_method()
                if sqli_owns(method, path) then
                    -- ngx.print traverses the full output-filter chain, so the response-phase
                    -- injection would otherwise stamp the trap page with honeytokens.
                    c.local_response = true
                    return sqli_respond(ip, method, path)
                end
            end

            local ctx = {
                ip = ip,
                path = path,
                host = var.http_host,
                segs = parse_query(qpos and sub(target, qpos + 1) or ""),
                cookie = need_cookie and var.http_cookie or nil,
            }

            if post_body_inspection then
                ngx.req.read_body()
                local raw = ngx.req.get_body_data()
                if raw then
                    local ct = var.http_content_type
                    if ct and find(ct, "application/x-www-form-urlencoded", 1, true) then
                        ctx.body_segs = parse_query(raw)
                    else
                        ctx.raw_body = raw
                    end
                end
            end

            detect_kinds(ctx)
            detect_comments(ctx)
        end

        -- Header-phase injection: decoy response headers and Set-Cookie baits (any content type).
        -- Token selection is precompiled; the timed region is the header write itself.
        function M.header_filter()
            local c = ngx.ctx.wadm
            if not c or c.local_response then
                return
            end
            local plan = c.plan

            if plan.has_body then
                local ct = ngx.header["Content-Type"]
                if ct and find(ct, "text/html", 1, true) then
                    -- The body is about to grow, so an upstream Content-Length would be wrong.
                    ngx.header.content_length = nil
                    c.inject = true
                end
            end

            local headers = plan.headers
            if #headers > 0 then
                local kind_start_us = now_us()
                for i = 1, #headers do
                    ngx.header[headers[i].name] = headers[i].value
                end
                local kind_delta_us = now_us() - kind_start_us
                ngx.log(ngx.WARN, "WADM TOKEN http_headers inject (us): ", kind_delta_us)
            end

            local cookies = plan.cookies
            if #cookies > 0 then
                local kind_start_us = now_us()
                for i = 1, #cookies do
                    -- Append rather than assign so upstream Set-Cookie headers are not clobbered.
                    local existing = ngx.header["Set-Cookie"]
                    if existing == nil then
                        ngx.header["Set-Cookie"] = cookies[i]
                    elseif type(existing) == "table" then
                        existing[#existing + 1] = cookies[i]
                        ngx.header["Set-Cookie"] = existing
                    else
                        ngx.header["Set-Cookie"] = { existing, cookies[i] }
                    end
                end
                local kind_delta_us = now_us() - kind_start_us
                ngx.log(ngx.WARN, "WADM TOKEN cookies inject (us): ", kind_delta_us)
            end
        end

        -- Body injection: every chunk is buffered untimed, then at end-of-stream each extra
        -- payload is spliced under its own timer and html_comments under the benchmarked one.
        function M.body_filter()
            local c = ngx.ctx.wadm
            if not c or not c.inject then
                return
            end

            local chunks = c.chunks
            if not chunks then
                chunks = {}
                c.chunks = chunks
            end
            local chunk = ngx.arg[1]
            if chunk ~= "" then
                chunks[#chunks + 1] = chunk
            end
            ngx.arg[1] = ""
            if not ngx.arg[2] then
                return
            end

            local plan = c.plan
            local body = concat(chunks)
            local extras = plan.extras
            for i = 1, #extras do
                local p = extras[i]
                local extra_start_us = now_us()
                local nb = splice_before(body, p.anchor, p.markup)
                local extra_delta_us = now_us() - extra_start_us
                if nb then body = nb end
                ngx.log(ngx.WARN, "WADM TOKEN ", p.kind, " inject (us): ", extra_delta_us)
            end

            local injection = plan.comments
            if injection then
                local injection_start_us = now_us()
                ngx.arg[1] = splice_before(body, "</body>", injection) or (body .. injection)
                local injection_delta_us = now_us() - injection_start_us
                ngx.log(ngx.WARN, "Injection execution time (us): ", injection_delta_us)
            else
                ngx.arg[1] = body
            end
        end

        wadm = M
        ngx.log(ngx.NOTICE, "WADM: configuration loaded successfully")
    }

    # Upstream is the `backend` Compose service (nginx:alpine) on port 80.
    upstream backend {
        server backend:80;
        # Reuse upstream connections rather than opening a new TCP connection per request.
        # Envoy and Apache pool backend connections by default and nginx does not, so without
        # this OpenResty is measured doing strictly more work than the edges it is compared
        # against. The cache is per worker process: the real ceiling is 32 x worker_processes.
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location / {
            # Detection (SQLi trap, additional kinds, html_comments) before the proxy.
            access_by_lua_block {
                if wadm then wadm.access() end
            }

            # Response-header baits, and Content-Length cleared for HTML that will be injected.
            header_filter_by_lua_block {
                if wadm then wadm.header_filter() end
            }

            # Buffer HTML until the last chunk, then splice the honeytokens in.
            body_filter_by_lua_block {
                if wadm then wadm.body_filter() end
            }

            proxy_pass http://backend;
            # Both are required before the upstream `keepalive` pool above is used at all: nginx
            # proxies with HTTP/1.0 by default, which has no persistent connections, and would
            # otherwise forward the client's Connection header upstream and close the pooled
            # connection.
            proxy_http_version 1.1;
            proxy_set_header Connection      "";
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
