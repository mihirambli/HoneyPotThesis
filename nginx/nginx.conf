worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log info;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;

    # In-memory store for "we saw a trigger from this IP" (TTL 86400s in Lua) — survives within worker process.
    lua_shared_dict wadm_state 10m;

    # Runs once per worker: loads /etc/openresty/config.json into global `wadm_config` (see compose volume mount).
    init_by_lua_block {
        local cjson = require "cjson"
        local ffi = require "ffi"

        ffi.cdef[[
            typedef long time_t;
            typedef long suseconds_t;
            struct timeval {
                time_t tv_sec;
                suseconds_t tv_usec;
            };
            int gettimeofday(struct timeval *tv, void *tz);
        ]]

        function get_micro_time()
            local tv = ffi.new("struct timeval")
            local rc = ffi.C.gettimeofday(tv, nil)
            if rc ~= 0 then
                ngx.log(ngx.ERR, "WADM: gettimeofday failed; falling back to ngx.now()")
                return math.floor(ngx.now() * 1000000)
            end
            return (tonumber(tv.tv_sec) * 1000000) + tonumber(tv.tv_usec)
        end

        local config_path = "/etc/openresty/config.json"
        local file, err = io.open(config_path, "r")
        if not file then
            ngx.log(ngx.ERR, "WADM: failed to open config file: ", err)
            return
        end

        local content = file:read("*a")
        file:close()

        local ok, config = pcall(cjson.decode, content)
        if not ok then
            ngx.log(ngx.ERR, "WADM: failed to parse config JSON: ", config)
            return
        end

        wadm_config = config
        ngx.log(ngx.NOTICE, "WADM: configuration loaded successfully")

        -- Global (later phases run in separate Lua chunks and cannot see init-block locals):
        -- "/*" matches every path, otherwise exact match against the request URI — the same
        -- semantics html_comments already uses for its path patterns.
        function wadm_path_matches(paths, uri)
            if not paths then return false end
            for _, pattern in ipairs(paths) do
                if pattern == "/*" or pattern == uri then
                    return true
                end
            end
            return false
        end

        -- Per-token on/off switch. A disabled token is fully dormant — neither injected nor
        -- watched. Accepts 1/on/true (and yes) as on; anything else is off. Absent defaults to
        -- ON so tokens authored before this field keep working.
        function wadm_token_enabled(token)
            local v = token.enabled
            if v == nil then return true end
            if v == true or v == 1 then return true end
            if type(v) == "string" then
                local s = string.lower(v)
                return s == "1" or s == "on" or s == "true" or s == "yes"
            end
            return false
        end

        -- Substring scan of a request's target surface (path, Host, query args) for a keyword
        -- an attacker would replay after harvesting a planted header or cookie value.
        local function keyword_in_request(kw, ctx)
            if not kw or kw == "" then return false end
            if string.find(ctx.uri or "", kw, 1, true)
               or string.find(ngx.var.host or "", kw, 1, true) then
                return true
            end
            for key, val in pairs(ctx.uri_args or {}) do
                local vals = type(val) == "table" and val or { val }
                for _, v in ipairs(vals) do
                    if string.find(tostring(v), kw, 1, true)
                       or string.find(key, kw, 1, true) then
                        return true
                    end
                end
            end
            return false
        end

        -- Registry of honeytoken kinds beyond html_comments. Each handler implements only the
        -- hooks its kind needs; everything here runs OUTSIDE the benchmarked html_comments timers
        -- so adding kinds never perturbs the injection/detection measurements.
        wadm_handlers = {
            -- Decoy response header, flagged when its value is replayed in a later request.
            http_headers = {
                header_inject = function(token)
                    if token.header_name and token.header_name ~= "" then
                        ngx.header[token.header_name] = token.header_value
                    end
                end,
                detect = function(token, ctx)
                    if keyword_in_request(token.trigger_keyword, ctx) then
                        ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ctx.ip,
                            " — http_header value '", token.trigger_keyword, "' replayed in request")
                        return true
                    end
                    return false
                end,
            },

            -- Bait cookie. A real browser replays the planted value unchanged, so a value that
            -- returns DIFFERENT is an attacker tampering with it (near-zero false positives).
            cookies = {
                header_inject = function(token)
                    if not token.cookie_name or token.cookie_name == "" then return end
                    local cookie = token.cookie_name .. "=" .. (token.cookie_value or "")
                    if token.attributes and token.attributes ~= "" then
                        cookie = cookie .. "; " .. token.attributes
                    end
                    -- Append rather than assign so upstream Set-Cookie headers are not clobbered.
                    local existing = ngx.header["Set-Cookie"]
                    if existing == nil then
                        ngx.header["Set-Cookie"] = cookie
                    elseif type(existing) == "table" then
                        existing[#existing + 1] = cookie
                        ngx.header["Set-Cookie"] = existing
                    else
                        ngx.header["Set-Cookie"] = { existing, cookie }
                    end
                end,
                detect = function(token, ctx)
                    local name = token.cookie_name
                    if name and name ~= "" then
                        local raw = ngx.var.http_cookie
                        if raw then
                            for pair in string.gmatch(raw, "[^;]+") do
                                local k, v = string.match(pair, "^%s*(.-)%s*=%s*(.-)%s*$")
                                if k == name then
                                    if v ~= (token.cookie_value or "") then
                                        ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ctx.ip,
                                            " — cookie '", name, "' tampered (got '", v,
                                            "', expected '", token.cookie_value or "", "')")
                                        return true
                                    end
                                    break
                                end
                            end
                        end
                    end
                    if keyword_in_request(token.trigger_keyword, ctx) then
                        ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ctx.ip,
                            " — cookie value '", token.trigger_keyword, "' replayed in request")
                        return true
                    end
                    return false
                end,
            },

            -- Fake sensitive path advertised as a hidden link; ANY request to it is suspect.
            decoy_paths = {
                body_payload = function(token, uri)
                    if (token.advertise_via or "link") ~= "link" then return nil end
                    if not wadm_path_matches(token.advertise_on_paths, uri) then return nil end
                    local markup = '<a href="' .. (token.trap_path or "")
                        .. '" style="display:none">' .. (token.link_text or "") .. '</a>'
                    return { markup = markup, anchor = "</body>" }
                end,
                detect = function(token, ctx)
                    local trap = token.trap_path
                    if not trap or trap == "" then return false end
                    local uri = ctx.uri or ""
                    local hit
                    if (token.match_type or "prefix") == "exact" then
                        hit = (uri == trap)
                    else
                        hit = (uri == trap) or (string.sub(uri, 1, #trap + 1) == trap .. "/")
                    end
                    if hit then
                        ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ctx.ip,
                            " — decoy path '", trap, "' requested (", uri, ")")
                        return true
                    end
                    return false
                end,
            },

            -- Hidden form field with a known value; a submission carrying a DIFFERENT value
            -- means the attacker edited the hidden input before sending the form.
            form_fields = {
                body_payload = function(token, uri)
                    if not wadm_path_matches(token.paths, uri) then return nil end
                    if not token.field_name or token.field_name == "" then return nil end
                    local markup = '<input type="hidden" name="' .. token.field_name
                        .. '" value="' .. (token.field_value or "") .. '">'
                    return { markup = markup, anchor = "</form>" }
                end,
                detect = function(token, ctx)
                    local name = token.field_name
                    local expected = token.field_value or ""
                    if name and name ~= "" then
                        local qv = ctx.uri_args and ctx.uri_args[name]
                        if qv ~= nil then
                            local vals = type(qv) == "table" and qv or { qv }
                            for _, v in ipairs(vals) do
                                if tostring(v) ~= expected then
                                    ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ctx.ip,
                                        " — form field '", name, "' tampered (got '", tostring(v),
                                        "', expected '", expected, "')")
                                    return true
                                end
                            end
                        end
                        -- POST-body tamper only when the shared flag is on (off by default, matching
                        -- the query-only detection stance the other edges use).
                        if wadm_config.post_body_inspection then
                            ngx.req.read_body()
                            local post_args = ngx.req.get_post_args()
                            local pv = post_args and post_args[name]
                            if pv ~= nil then
                                local vals = type(pv) == "table" and pv or { pv }
                                for _, v in ipairs(vals) do
                                    if tostring(v) ~= expected then
                                        ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ctx.ip,
                                            " — form field '", name, "' tampered in POST (got '",
                                            tostring(v), "', expected '", expected, "')")
                                        return true
                                    end
                                end
                            end
                        end
                    end
                    if keyword_in_request(token.trigger_keyword, ctx) then
                        ngx.log(ngx.WARN, "WADM ALERT: honeytoken triggered by ", ctx.ip,
                            " — form field keyword '", token.trigger_keyword, "' seen in request")
                        return true
                    end
                    return false
                end,
            },
        }
    }

    # Upstream is the `backend` Compose service (nginx:alpine) on port 80.
    upstream backend {
        server backend:80;
    }

    server {
        listen 80;
        server_name _;

        location / {
            # Before proxy: strip honeytoken triggers from URI args / POST body; record client IP in shm on hit.
            access_by_lua_block {
                if not wadm_config or not wadm_config.honeytokens then
                    return
                end

                local ip = ngx.var.remote_addr
                local wadm = ngx.shared.wadm_state

                -- Additional honeytoken kinds (untimed, deploy+detect only): cookie/form tamper,
                -- decoy-path hits, header/cookie value replays. Run before the html_comments block
                -- so its early-returns cannot skip them; same sink (WARN log + wadm_state IP record)
                -- and deliberately outside the benchmarked detection timer below.
                if wadm_handlers then
                    local dctx = { ip = ip, uri = ngx.var.uri, uri_args = ngx.req.get_uri_args() }
                    for hname, handler in pairs(wadm_handlers) do
                        if handler.detect then
                            local tokens = wadm_config.honeytokens[hname]
                            if tokens then
                                for _, token in ipairs(tokens) do
                                    if wadm_token_enabled(token) and handler.detect(token, dctx) then
                                        wadm:set(ip, true, 86400)
                                    end
                                end
                            end
                        end
                    end
                end

                local comments = wadm_config.honeytokens.html_comments
                if not comments then
                    return
                end

                local triggers = {}
                for _, token in ipairs(comments) do
                    if wadm_token_enabled(token)
                       and token.trigger_keyword and token.trigger_keyword ~= "" then
                        triggers[#triggers + 1] = token.trigger_keyword
                    end
                end

                if #triggers == 0 then
                    return
                end

                local detected = false
                local detection_start_us = get_micro_time()

                -- Inspect URI query parameters
                local uri_args = ngx.req.get_uri_args()
                local dirty_uri = false

                for key, val in pairs(uri_args) do
                    local vals = type(val) == "table" and val or { val }
                    for _, v in ipairs(vals) do
                        local v_str = tostring(v)
                        for _, keyword in ipairs(triggers) do
                            if string.find(v_str, keyword, 1, true)
                               or string.find(key, keyword, 1, true) then
                                ngx.log(ngx.WARN,
                                    "WADM ALERT: honeytoken triggered by ", ip,
                                    " — keyword '", keyword,
                                    "' found in URI arg '", key, "=", v_str, "'")
                                detected = true
                                uri_args[key] = nil
                                dirty_uri = true
                            end
                        end
                    end
                end

                if dirty_uri then
                    ngx.req.set_uri_args(uri_args)
                end

                -- Inspect POST body parameters (behind post_body_inspection flag; disabled by
                -- default so detection is a query-string scan only, matching Apache/WASM).
                -- The whole block is a future feature to be enabled across all edges together.
                if wadm_config.post_body_inspection then
                ngx.req.read_body()
                local post_args, err = ngx.req.get_post_args()

                if post_args then
                    local dirty_post = false

                    for key, val in pairs(post_args) do
                        local vals = type(val) == "table" and val or { val }
                        for _, v in ipairs(vals) do
                            local v_str = tostring(v)
                            for _, keyword in ipairs(triggers) do
                                if string.find(v_str, keyword, 1, true)
                                   or string.find(key, keyword, 1, true) then
                                    ngx.log(ngx.WARN,
                                        "WADM ALERT: honeytoken triggered by ", ip,
                                        " — keyword '", keyword,
                                        "' found in POST arg '", key, "=", v_str, "'")
                                    detected = true
                                    post_args[key] = nil
                                    dirty_post = true
                                end
                            end
                        end
                    end

                    if dirty_post then
                        local parts = {}
                        for k, v in pairs(post_args) do
                            local vs = type(v) == "table" and v or { v }
                            for _, sv in ipairs(vs) do
                                parts[#parts + 1] = ngx.escape_uri(k)
                                    .. "=" .. ngx.escape_uri(sv)
                            end
                        end
                        ngx.req.set_body_data(table.concat(parts, "&"))
                    end
                else
                    local body_data = ngx.req.get_body_data()
                    if body_data then
                        for _, keyword in ipairs(triggers) do
                            if string.find(body_data, keyword, 1, true) then
                                ngx.log(ngx.WARN,
                                    "WADM ALERT: honeytoken triggered by ", ip,
                                    " — keyword '", keyword,
                                    "' found in request body")
                                detected = true
                            end
                        end
                    end
                end
                end -- post_body_inspection

                if detected then
                    wadm:set(ip, true, 86400)
                    ngx.log(ngx.WARN,
                        "WADM ALERT: attacker IP ", ip, " recorded in wadm_state")
                end

                local detection_end_us = get_micro_time()
                local detection_delta_us = detection_end_us - detection_start_us
                -- Only record detection timing for trigger-bearing requests so all edges
                -- sample the same population (the keyword-matching request).
                if detected then
                    ngx.log(ngx.WARN, "Detection execution time (us): ", detection_delta_us)
                end
            }

            # Upstream may send Content-Length; clear it for HTML so body_filter can change size safely.
            header_filter_by_lua_block {
                local ct = ngx.header["Content-Type"] or ""
                if ngx.re.find(ct, "text/html", "ijo") then
                    ngx.header.content_length = nil
                end

                -- Header-phase honeytoken injection (untimed): decoy response headers and
                -- Set-Cookie baits. Only touches response headers, so it is content-type agnostic
                -- and needs no Content-Length handling.
                if wadm_handlers and wadm_config and wadm_config.honeytokens then
                    local uri = ngx.var.uri
                    for hname, handler in pairs(wadm_handlers) do
                        if handler.header_inject then
                            local tokens = wadm_config.honeytokens[hname]
                            if tokens then
                                for _, token in ipairs(tokens) do
                                    if wadm_token_enabled(token)
                                       and wadm_path_matches(token.paths, uri) then
                                        handler.header_inject(token)
                                    end
                                end
                            end
                        end
                    end
                end
            }

            # Buffer streamed HTML in ngx.ctx until last chunk, inject honeytoken comments before </body>.
            body_filter_by_lua_block {
                local ct = ngx.header["Content-Type"] or ""
                if not ngx.re.find(ct, "text/html", "ijo") then
                    return
                end

                if not wadm_config or not wadm_config.honeytokens then
                    return
                end

                local uri = ngx.var.uri

                -- html_comments payloads (the benchmarked reference); may be empty if the page
                -- matches only the additional kinds below.
                local to_inject = {}
                local comments = wadm_config.honeytokens.html_comments
                if comments then
                    for _, token in ipairs(comments) do
                        if wadm_token_enabled(token) then
                            for _, pattern in ipairs(token.paths) do
                                if pattern == "/*" or pattern == uri then
                                    to_inject[#to_inject + 1] = token.comment_value
                                    break
                                end
                            end
                        end
                    end
                end

                -- Additional-kind body payloads (hidden form fields before </form>, decoy links
                -- before </body>) collected via the registry — spliced untimed on EOF.
                local extra = {}
                if wadm_handlers then
                    for hname, handler in pairs(wadm_handlers) do
                        if handler.body_payload then
                            local tokens = wadm_config.honeytokens[hname]
                            if tokens then
                                for _, token in ipairs(tokens) do
                                    if wadm_token_enabled(token) then
                                        local p = handler.body_payload(token, uri)
                                        if p then extra[#extra + 1] = p end
                                    end
                                end
                            end
                        end
                    end
                end

                if #to_inject == 0 and #extra == 0 then
                    return
                end

                local ctx = ngx.ctx
                if not ctx.body_chunks then
                    ctx.body_chunks = {}
                end

                if ngx.arg[1] ~= "" then
                    ctx.body_chunks[#ctx.body_chunks + 1] = ngx.arg[1]
                end
                ngx.arg[1] = ""

                if ngx.arg[2] then
                    if #extra == 0 then
                        -- Unchanged benchmarked path (byte-for-byte): assemble → locate first
                        -- </body> → splice → write back, all INSIDE the timer per the canonical
                        -- injection contract.
                        local injection = table.concat(to_inject, "\n")
                        local injection_start_us = get_micro_time()
                        local body = table.concat(ctx.body_chunks)

                        local new_body, n = ngx.re.sub(body, "</body>", injection .. "\n</body>", "io")
                        if not n or n == 0 then
                            new_body = body .. injection
                        end

                        ngx.arg[1] = new_body
                        local injection_end_us = get_micro_time()
                        local injection_delta_us = injection_end_us - injection_start_us
                        ngx.log(ngx.WARN, "Injection execution time (us): ", injection_delta_us)
                    else
                        -- Additional-kind payloads present: splice them first (untimed), then run
                        -- the html_comments splice under the timer on the already-assembled body.
                        local body = table.concat(ctx.body_chunks)
                        for _, p in ipairs(extra) do
                            local nb, cnt = ngx.re.sub(body, p.anchor, p.markup .. "\n" .. p.anchor, "io")
                            if cnt and cnt > 0 then body = nb end
                        end

                        if #to_inject > 0 then
                            local injection = table.concat(to_inject, "\n")
                            local injection_start_us = get_micro_time()
                            local new_body, n = ngx.re.sub(body, "</body>", injection .. "\n</body>", "io")
                            if not n or n == 0 then
                                new_body = body .. injection
                            end
                            ngx.arg[1] = new_body
                            local injection_end_us = get_micro_time()
                            local injection_delta_us = injection_end_us - injection_start_us
                            ngx.log(ngx.WARN, "Injection execution time (us): ", injection_delta_us)
                        else
                            ngx.arg[1] = body
                        end
                    end
                end
            }

            proxy_pass http://backend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
