# Baseline config for the `envoy-wasm` service — the SAME edge with WADM removed.
#
# Mounted in place of envoy-wasm.yaml via ${ENVOY_WASM_CONF} (see docker-compose.yml) by
# benchmarks/run_baseline_benchmark.py. Identical to envoy-wasm.yaml except that the
# envoy.filters.http.wasm entry is gone, taking the `{{WASM_CONFIG_JSON}}` placeholder with it —
# entrypoint.sh's sed is a no-op when the placeholder is absent, so the container still boots
# unchanged and rust-builder's artifact is simply never loaded.
#
# This file is functionally identical to envoy/envoy-baseline.yaml (Envoy + router only). That is
# intentional: the two bare series should overlap within noise, which makes them a free
# run-to-run variance check on the measurement rig.
static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # Forward the client IP in X-Forwarded-For, as OpenResty and Apache already do, so the
                # origin's access log records the real client for every edge. It also pins Envoy's
                # downstream address to the socket peer, which a client-sent XFF cannot spoof.
                use_remote_address: true
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend_vhost
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: backend_cluster
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: backend_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend
                      port_value: 80
