# httpd-conn.conf — Apache edge, REMEDIATION variant (edge key: apache_lua_conn).
#
# Byte-identical to httpd.conf except for one directive: LuaScope is `conn` rather than `thread`.
# Every script, hook, filter and proxy directive is otherwise the same, so a difference measured
# against the apache_lua edge is attributable to the Lua state's lifetime and nothing else.
#
# Why this file exists
# ────────────────────
# Apache is the only edge that segfaults under WADM. The crash was isolated to the mod_lua output
# filter (inject.lua): with the body filter disabled, 900 req/s for 20 s produced 0 segfaults
# against 10 with it. It is driven by cumulative request volume rather than concurrency — at a
# fixed 90 req/s, 909 requests are clean and 8,100 crash four times — which is the signature of
# something accumulating per request in a reused Lua state, not a race.
#
# Four configurations were measured under identical load. `LuaCodeCache stat` changed nothing
# (9 segfaults vs 7), so the code cache is not involved. `LuaScope request` eliminated the crash
# but left a third of the offered load unplaced, because a fresh Lua state per request is too
# expensive to be usable. `LuaScope conn` eliminated the crash at baseline throughput, which is
# what this file selects.
#
# Measured at 90 req/s for 90 s after a warm-up, one run per arm:
#     LuaScope thread   8,109 requests   4 segfaults   median 1.02 ms   p95 3.39 ms
#     LuaScope conn     8,109 requests   0 segfaults   median 1.32 ms   p95 6.43 ms
#
# KNOWN BEHAVIOURAL COST — this is a remediation, not a free fix
# ──────────────────────────────────────────────────────────────
# detect.lua keeps its in-memory attacker store in a module-scope table, which docs/EDGE_LEVELING.md
# requires to mirror OpenResty's ngx.shared.wadm_state. Under `conn` scope that table is rebuilt for
# every connection, so a recorded attacker IP is forgotten as soon as the connection closes. The
# timed region still performs an equivalent table write, so cost measurements stay comparable
# against the other edges — but the attacker-recording FEATURE is degraded, and this configuration
# therefore breaks the state-persistence parity invariant. It is reported as a remediation with its
# cost stated, never as the baseline.
#
# Phase 1: LuaHookAccessChecker (detect.lua) inspects and cleans query strings before ProxyPass.
# Phase 2: SetOutputFilter (inject.lua) injects HTML honeytoken comments into responses.

ServerRoot "/usr/local/apache2"
Listen 80

User  daemon
Group daemon

ServerName localhost

ErrorLog  /proc/self/fd/2
# No access log: Envoy writes none, so this charged Apache a per-request write the Envoy edges never
# pay. The per-request record now lives in the origin's access log (client IP via
# X-Forwarded-For, which mod_proxy adds) plus the WADM ALERT / WADM TRAP lines.

# ── Core modules required for a functional httpd process ─────────────────────
LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule dir_module          modules/mod_dir.so
LoadModule mime_module         modules/mod_mime.so

# ── mod_headers: strip Content-Length on filtered responses so body size change is safe ─
LoadModule headers_module      modules/mod_headers.so

# ── Reverse proxy ─────────────────────────────────────────────────────────────
LoadModule proxy_module        modules/mod_proxy.so
LoadModule proxy_http_module   modules/mod_proxy_http.so

# ── mod_lua: WADM hooks ────────────────────────────────────────────────────────
LoadModule lua_module          modules/mod_lua.so

# ── mod_filter: required for AddOutputFilterByType ────────────────────────────
LoadModule filter_module       modules/mod_filter.so

# ── Lua runtime ────────────────────────────────────────────────────────────────
LuaPackagePath "/usr/local/apache2/scripts/?.lua"
# conn scope: the Lua state lives for one connection instead of for the worker thread's lifetime.
# This is THE one functional difference from httpd.conf, and it is what stops the segfaults — see
# the header. It also resets detect.lua's attacker store per connection, which is the cost.
LuaScope conn
# Load each script once, like the other three edges do. The default (`stat`) stats every script
# file on every hook call to check for edits; after an edit, `docker compose restart apache`.
LuaCodeCache forever

# Register the output filter name at server scope (required by SetOutputFilter below).
LuaOutputFilter WADM_INJECT /usr/local/apache2/scripts/inject.lua handle_inject

<VirtualHost *:80>
    ServerName localhost

    # Phase 1 — Detection & cleaning (request), plus staging the response-header baits
    # (err_headers_out survives ProxyPass, so no separate Fixups hook is needed).
    LuaHookAccessChecker /usr/local/apache2/scripts/detect.lua handle_detect early

    # Phase 1a — Fake SQL-injection trap. lua_map_handler is hooked ahead of mod_proxy's
    # handler, so this terminates POST /api/login locally and the origin never sees it;
    # handle_login returns DECLINED for anything else, leaving ProxyPass below untouched.
    # The pattern is anchored because mod_lua matches it as an unanchored regex search.
    LuaMapHandler "^/api/login$" /usr/local/apache2/scripts/login.lua handle_login

    # Phase 2 — Reverse proxy to origin.
    ProxyPreserveHost On
    ProxyPass        / http://backend:80/
    ProxyPassReverse / http://backend:80/

    # Phase 3 — Injection (response).
    # SetOutputFilter applies the filter unconditionally; inject.lua guards on content-type internally.
    # Header always unset removes Content-Length so the body size change from injection is safe.
    # "always" is required to affect proxied responses (plain "unset" only touches Apache-generated ones).
    SetOutputFilter WADM_INJECT
    Header always unset Content-Length
</VirtualHost>
