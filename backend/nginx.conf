worker_processes auto;
error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Extra fields vs default combined log — useful when debugging request sizes to the dummy origin.
    # $remote_addr is always the edge container; xff carries the real client, and is what replaced
    # the per-request access logs the edges themselves no longer write.
    log_format body_log '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent '
                        'req_content_length=$content_length '
                        'xff="$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log body_log;

    server {
        listen 80;
        server_name _;

        # Static honeypot "app" only; WADM injection/detection happens in the edge container, not here.
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Functional-matrix cases (benchmarks/functional_matrix.py). Neither path is requested by
        # the latency benchmark, so they change nothing it measures.
        #
        # A gzip-encoded HTML page: does an edge that rewrites the body corrupt an encoded one?
        # gzip_proxied any, because a request arriving through a proxy is otherwise never compressed.
        location /test/gz/ {
            root /usr/share/nginx/html;
            gzip on;
            gzip_types text/html;
            gzip_min_length 0;
            gzip_proxied any;
        }

        # A response with no body at all.
        location = /test/empty {
            return 204;
        }
    }
}
